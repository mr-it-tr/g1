<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Computer Explorers 3D – ÖZEL Global Eğitim Koleji</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#0D497D;--gold:#EAA526;--sky:#50A9D3;--pale:#EAF4FA}
*{box-sizing:border-box}
body{margin:0;font-family:Poppins,'Segoe UI',Arial,sans-serif;background:var(--pale);color:#12324d;font-size:20px;user-select:none}
header{background:var(--navy);color:#fff;display:flex;align-items:center;gap:10px;padding:8px 14px;flex-wrap:wrap}
header img{height:56px;background:#fff;border-radius:12px;padding:2px}
.brand{font-weight:700;flex:1;font-size:17px;min-width:170px}
.pill{background:#fff;color:var(--navy);border-radius:20px;padding:4px 14px;font-weight:700;font-size:22px;white-space:nowrap}
#vb{font-size:26px;background:var(--gold);border:0;border-radius:50%;width:48px;height:48px;cursor:pointer}
label{font-size:14px;cursor:pointer}
#prog{display:flex;gap:8px;justify-content:center;padding:10px}
#prog i{font-style:normal;font-size:30px;background:#cfe3f0;border-radius:50%;width:54px;height:54px;display:flex;align-items:center;justify-content:center}
#prog i.d{background:var(--gold)}#prog i.c{background:var(--sky);transform:scale(1.2)}
main{max-width:960px;margin:0 auto 24px;padding:0 12px}
.card{background:#fff;border-radius:28px;padding:18px;box-shadow:0 6px 18px #0d497d22;border-top:8px solid var(--gold);text-align:center;min-height:430px}
h1{color:var(--navy);margin:.2em 0}
.btn{font-size:56px;border:0;border-radius:50%;width:110px;height:110px;background:var(--gold);color:var(--navy);cursor:pointer;box-shadow:0 8px 0 #b9801a;margin:10px}
.btn:active{transform:translateY(6px);box-shadow:0 2px 0 #b9801a}
.row{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}
.big{font-size:90px;line-height:1.1}.bubble{background:#fff7e0;border:4px solid var(--gold);border-radius:20px;padding:6px 18px;display:inline-block;font-size:34px}
.sc{display:inline-block;perspective:600px;padding:14px}
.cube{display:block;position:relative;width:var(--s);height:var(--s);transform-style:preserve-3d;animation:spin 7s linear infinite}
.cube i{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:calc(var(--s)*.6);background:#fff;border:4px solid var(--sky);border-radius:14px}
.cube i.t{background:var(--gold)}
.cube i:nth-child(1){transform:translateZ(calc(var(--s)/2))}
.cube i:nth-child(2){transform:rotateY(90deg) translateZ(calc(var(--s)/2))}
.cube i:nth-child(3){transform:rotateY(180deg) translateZ(calc(var(--s)/2))}
.cube i:nth-child(4){transform:rotateY(-90deg) translateZ(calc(var(--s)/2))}
.cube i:nth-child(5){transform:rotateX(90deg) translateZ(calc(var(--s)/2))}
.cube i:nth-child(6){transform:rotateX(-90deg) translateZ(calc(var(--s)/2))}
@keyframes spin{from{transform:rotateX(-20deg) rotateY(0)}to{transform:rotateX(-20deg) rotateY(360deg)}}
.part{background:none;border:4px solid transparent;border-radius:20px;cursor:pointer;font:inherit;font-weight:600;color:var(--navy)}
.part small,.spot small{display:block;font-size:15px}
.part.sel,.hint{border-color:var(--gold);background:#fff7e0;animation:pulse .6s infinite alternate}
.part.off{opacity:.35;pointer-events:none}.part.win{background:#bfe8c8;border-color:#2e9e57}
@keyframes pulse{to{transform:scale(1.08)}}
.spot{width:210px;padding:6px;border-radius:20px;border:4px solid transparent;cursor:pointer}
.ghost{font-size:84px;filter:grayscale(1);opacity:.3;height:120px}
.pad{height:34px;border-radius:50%;background:radial-gradient(#EAA526aa,#EAA52622);margin:0 12px}
.desk{height:80px;margin:-46px auto 14px;width:94%;background:linear-gradient(#d49a58,#a56a30);transform:perspective(500px) rotateX(55deg);border-radius:12px;box-shadow:0 14px 0 #7d4d20}
.shake{animation:shake .4s}@keyframes shake{25%{transform:translateX(-14px)}75%{transform:translateX(14px)}}
.wrap{perspective:700px}
.arena,.board{position:relative;height:330px;overflow:hidden;border-radius:18px;background:linear-gradient(#cfeaf7,#fff7e0);border:4px solid var(--sky)}
.board{background:linear-gradient(#0D497D,#1b6aa8);border:0;border-bottom:10px solid var(--gold);transform:rotateX(18deg);transform-origin:bottom}
.bee{position:absolute;background:none;border:0;cursor:pointer;filter:drop-shadow(0 10px 4px #0003);animation:wob .5s infinite alternate}
@keyframes wob{to{transform:translate(14px,-10px) rotate(12deg)}}
.let{position:absolute;top:-70px;width:68px;height:68px;border-radius:16px;border:0;background:var(--gold);font:700 36px Poppins,Arial,sans-serif;color:#12324d;cursor:pointer;box-shadow:0 6px 0 #b9801a;animation:fall linear forwards}
@keyframes fall{to{top:100%}}
#cf{position:fixed;inset:0;pointer-events:none;z-index:9}
</style>
</head>

  badges: {3:'🌟 Computer Star', 2:'🚀 Computer Explorer', 1:'😊 Computer Friend'},
  storageKey: 'ozel_g1_computer_parts_best'
};

/* ================= CONTENT (edit me) =================
 Children cannot read, so Robo Pixel SPEAKS every instruction: [English, Türkçe].
 Voices come from the computer/tablet (works best in Chrome / Edge).        */
const CONTENT = {
  hello: ['Hello! I am Robo Pixel! Let us build a computer!', 'Merhaba! Ben Robo Pixel! Hadi bir bilgisayar yapalım!'],
  great: ['Great job!', 'Harika!'],
  oops:  ['Oops! Try again!', 'Olmadı! Tekrar dene!'],
  over:  ['Let us try again!', 'Hadi tekrar deneyelim!'],
  end:   ['You did it! Well done!', 'Başardın! Aferin!'],
  parts: {
    screen:   {e:'🖥️', en:'Screen',   tr:'Ekran'},
    keyboard: {e:'⌨️', en:'Keyboard', tr:'Klavye'},
    mouse:    {e:'🖱️', en:'Mouse',    tr:'Fare'}
  },
  missions: [
    {icon:'🧩', kind:'place', say:['Put each part on the desk! Tap a part, then tap its place.', 'Her parçayı masaya koy! Önce parçaya, sonra yerine dokun.']},
    {icon:'🐝', kind:'bee',   say:['The mouse clicks! Click the bees!', 'Fare tıklar! Arılara tıkla!']},
    {icon:'⌨️', kind:'rush',  say:['The keyboard has letters! Press the letter you see!', 'Klavyede harfler var! Gördüğün harfe bas!']},
    {icon:'🤖', kind:'help',  say:['Help Robo! Which part does he need?', 'Robo’ya yardım et! Hangi parça lazım?'],
     rounds: [
      {need:'👀❓', a:'screen',   say:['Robo cannot see! Which part helps?', 'Robo göremiyor! Hangi parça yardım eder?']},
      {need:'👆❓', a:'mouse',    say:['Robo wants to click! Which part helps?', 'Robo tıklamak istiyor! Hangi parça yardım eder?']},
      {need:'✍️❓', a:'keyboard', say:['Robo wants to type! Which part helps?', 'Robo yazmak istiyor! Hangi parça yardım eder?']}
     ]}
  ]
};

/* ================= GAME CODE (no need to edit) ================= */
const $=s=>document.querySelector(s),ST=SETTINGS,C=CONTENT,M=C.missions,P=C.parts,IDS=Object.keys(P);
const shuffle=a=>[...a].sort(()=>Math.random()-.5);
let S,timer,voice=true,ac;
const reset=()=>S={m:0,score:0,lives:ST.lives,ms:0,done:true,catchKey:null};

function say(en,tr){if(!voice||!window.speechSynthesis)return;try{speechSynthesis.cancel();[[en,'en-US'],[tr,'tr-TR']].forEach(([t,l])=>{if(t){const u=new SpeechSynthesisUtterance(t);u.lang=l;u.rate=.85;speechSynthesis.speak(u)}})}catch(e){}}
const sayA=a=>say(a[0],a[1]);
function tone(f,d){if(!$('#snd').checked)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;g.gain.value=.12;o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}
const sfx={ok:()=>{tone(660,.12);setTimeout(()=>tone(880,.15),120)},bad:()=>tone(200,.3),win:()=>[523,659,784,1046].forEach((f,i)=>setTimeout(()=>tone(f,.18),i*140))};
function confetti(n){const c=$('#cf'),x=c.getContext('2d'),cols=['#EAA526','#50A9D3','#0D497D','#e85d75'];c.width=innerWidth;c.height=innerHeight;
 const Q=[...Array(n)].map(()=>({x:innerWidth/2,y:innerHeight/3,vx:(Math.random()-.5)*16,vy:-Math.random()*13-2,s:6+Math.random()*7,c:cols[Math.random()*4|0],l:100}));
 (function f(){x.clearRect(0,0,c.width,c.height);let a=0;Q.forEach(p=>{if(p.l-->0){a=1;p.x+=p.vx;p.y+=p.vy;p.vy+=.4;x.fillStyle=p.c;x.fillRect(p.x,p.y,p.s,p.s)}});if(a)requestAnimationFrame(f);else x.clearRect(0,0,c.width,c.height)})()}

const cube=(id,s=90)=>`<span class="sc"><span class="cube" style="--s:${s}px">${'<i>'+P[id].e+'</i>'.repeat(1)}${[1,2,3].map(()=>'<i>'+P[id].e+'</i>').join('')}<i class="t"></i><i class="t"></i></span></span>`;
const lab=id=>`<small>${P[id].en} · ${P[id].tr}</small>`;
function hud(){const l=Math.max(0,S.lives);$('#score').textContent='⭐ '+S.score;$('#lives').textContent='❤️'.repeat(l)+'🖤'.repeat(ST.lives-l);
 $('#prog').innerHTML=M.map((m,i)=>`<i class="${i<S.m?'d':i==S.m?'c':''}">${m.icon}</i>`).join('')}
function show(h){clearInterval(timer);S.catchKey=null;$('#stage').innerHTML='<div class="card">'+h+'</div>';hud();scrollTo(0,0)}
const bonus=()=>Math.round(ST.speedBonus*Math.max(0,1-(Date.now()-S.t0)/1000/ST.taskTime));
function right(en,tr){S.score+=ST.points+bonus();S.t0=Date.now();hud();sfx.ok();confetti(40);en?say(C.great[0]+' '+en+'!',C.great[1]+' '+tr+'!'):sayA(C.great)}
function wrong(hint){S.lives--;hud();sfx.bad();const c=$('.card');c.classList.add('shake');setTimeout(()=>c.classList.remove('shake'),400);
 if(S.lives<=0)return gameOver();sayA(C.oops);if(hint)hint.classList.add('hint')}

function start(){reset();show(`<h1>🖥️ Computer Explorers</h1><div class="row">${IDS.map(i=>cube(i,100)).join('')}</div><button class="btn" id="go">▶</button>`);
 $('#go').onclick=()=>{sayA(C.hello);intro()};$('#go').focus()}
function intro(){const m=M[S.m];S.ms=S.score;sayA(m.say);
 show(`<div class="big" style="font-size:130px">${m.icon}</div><div class="bubble">🤖 🔊</div><br><button class="btn" id="go">▶</button>`);
 $('#go').onclick=run;$('#go').focus()}
function run(){S.t0=Date.now();({place,bee,rush,help})[M[S.m].kind]()}

function place(){let sel=null,n=0;
 show(`<div class="row">${shuffle(IDS).map(i=>`<div class="spot" data-id="${i}"><div class="ghost">${P[i].e}</div><div class="pad"></div></div>`).join('')}</div><div class="desk"></div><div class="row">${shuffle(IDS).map(i=>`<button class="part" data-id="${i}">${cube(i)}${lab(i)}</button>`).join('')}</div>`);
 document.querySelectorAll('.part').forEach(b=>b.onclick=()=>{sel=b;document.querySelectorAll('.part').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');say(P[b.dataset.id].en,P[b.dataset.id].tr)});
 document.querySelectorAll('.spot').forEach(sp=>sp.onclick=()=>{if(!sel||sp.classList.contains('full'))return;const id=sel.dataset.id;
  if(id==sp.dataset.id){sp.classList.remove('hint');sp.classList.add('full');sp.innerHTML=cube(id,120)+lab(id);sel.remove();sel=null;right(P[id].en,P[id].tr);if(++n==IDS.length)setTimeout(done,1200)}
  else wrong(document.querySelector('.spot[data-id="'+id+'"]'))})}

function help(){const R=shuffle(M[S.m].rounds);let i=0;
 const go=()=>{const r=R[i];S.t0=Date.now();show(`<div class="big">🤖 <span class="bubble">${r.need}</span></div><div class="row">${shuffle(IDS).map(id=>`<button class="part" data-id="${id}">${cube(id,100)}${lab(id)}</button>`).join('')}</div>`);sayA(r.say);
  document.querySelectorAll('.part').forEach(b=>b.onclick=()=>{if(b.dataset.id==r.a){b.classList.remove('hint');b.classList.add('win');right(P[r.a].en,P[r.a].tr);setTimeout(()=>++i<R.length?go():done(),1300)}
   else{b.classList.add('off');wrong(document.querySelector('.part[data-id="'+r.a+'"]'))}})};go()}

function bee(){let n=0,hit=0;show('<div class="big" id="pt">🐝 0</div><div class="arena" id="arena"></div>');const ar=$('#arena'),pt=$('#pt');
 timer=setInterval(()=>{if(n>=ST.beeCount){if(!ar.children.length){clearInterval(timer);S.score+=hit*ST.beePoints;hud();done()}return}n++;
  const e=document.createElement('button');e.className='bee';e.textContent='🐝';e.style.fontSize=(40+Math.random()*50)+'px';e.style.left=Math.random()*85+'%';e.style.top=Math.random()*70+'%';
  e.onclick=()=>{e.remove();hit++;sfx.ok();confetti(8);pt.textContent='🐝 '+hit};ar.appendChild(e);setTimeout(()=>e.remove(),ST.beeLife*1000)},ST.beeEvery*1000)}

function rush(){let n=0,hit=0;show('<div class="big" id="pt">⌨️ 0</div><div class="wrap"><div class="board" id="board"></div></div>');const bd=$('#board'),pt=$('#pt');
 const got=e=>{e.remove();hit++;sfx.ok();confetti(8);pt.textContent='⌨️ '+hit};
 S.catchKey=c=>{const e=bd.querySelector('[data-c="'+c.toUpperCase()+'"]');if(e)got(e)};
 timer=setInterval(()=>{if(n>=ST.rushCount){if(!bd.children.length){clearInterval(timer);S.score+=hit*ST.rushPoints;hud();done()}return}n++;
  const c=ST.rushLetters[Math.random()*ST.rushLetters.length|0],e=document.createElement('button');e.className='let';e.dataset.c=c;e.textContent=c;
  e.style.left=4+Math.random()*84+'%';e.style.animationDuration=ST.rushFall+'s';e.onclick=()=>got(e);e.onanimationend=()=>e.remove();bd.appendChild(e)},ST.rushEvery*1000)}

function done(){S.done=true;confetti(150);sfx.win();sayA(C.great);S.m++;const last=S.m>=M.length;
 show(`<div class="big" style="font-size:110px">⭐⭐⭐</div><div class="row">${IDS.map(i=>cube(i,80)).join('')}</div><button class="btn" id="go">${last?'🏁':'▶'}</button>`);
 $('#go').onclick=()=>last?final():intro();$('#go').focus()}
function gameOver(){S.catchKey=null;sayA(C.over);show('<div class="big" style="font-size:130px">💔🤖</div><button class="btn" id="go">↻</button>');
 $('#go').onclick=()=>{S.score=S.ms;S.lives=ST.lives;hud();run()};$('#go').focus()}
function final(){const max=(IDS.length*2)*(ST.points+ST.speedBonus)+ST.beeCount*ST.beePoints+ST.rushCount*ST.rushPoints,p=S.score/max,stars=p>=ST.star3?3:p>=ST.star2?2:1;let best=0;
 try{best=+localStorage.getItem(ST.storageKey)||0;if(S.score>best)localStorage.setItem(ST.storageKey,S.score)}catch(e){}
 confetti(250);sfx.win();sayA(C.end);
 show(`<div class="big" style="font-size:100px">${'⭐'.repeat(stars)}${'☆'.repeat(3-stars)}</div><h1>${ST.badges[stars]}</h1><p>⭐ ${S.score} &nbsp; 🏅 ${Math.max(best,S.score)}${S.score>best?' 🎉':''}</p><div class="row">${IDS.map(i=>cube(i,80)).join('')}</div><button class="btn" id="go">↻</button>`);
 $('#go').onclick=()=>{reset();intro()}}

$('#vb').onclick=()=>{voice=!voice;$('#vb').textContent=voice?'🔊':'🔇';if(!voice&&window.speechSynthesis)speechSynthesis.cancel()};
addEventListener('keydown',e=>{if(e.key=='Enter'||e.key==' '){const b=$('#go');if(b){e.preventDefault();b.click()}return}if(S.catchKey&&e.key.length==1)S.catchKey(e.key)});
reset();start();
</script>
</body>
</html>
